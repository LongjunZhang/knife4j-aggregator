spring:
  application:
    name: order-service
  cloud:
    nacos:
      # Nacos 服务地址
      server-addr: 127.0.0.1:8848
      # Nacos 认证
      username: nacos
      password: nacos
      discovery:
        enabled: true
        namespace: public
      config:
        # 禁用配置中心（本项目使用本地配置，不从 Nacos 拉取）
        enabled: false

