# ============================================
# Knife4j 文档聚合系统 - Docker Compose 配置
# 
# 使用说明:
#   1. 复制 .env.example 为 .env 并修改配置
#   2. 确保 Nacos、MongoDB、Ollama 已运行
#   3. 执行: docker-compose up -d
#   4. 访问: http://localhost:9090/doc.html
# ============================================
version: '3.8'

services:
  # ==========================================
  # Doc Aggregator 服务（包含前端 UI）
  # ==========================================
  doc-aggregator:
#    image: ${DOCKER_USERNAME:-zhanglongjun}/knife4j-doc-aggregator:${VERSION:-latest}
    image: zhanglongjun/knife4j-doc-aggregator:1.0.0
    container_name: knife4j-doc-aggregator
    ports:
      - "${DOC_AGGREGATOR_PORT:-9090}:9090"
    environment:
      # ------------------------------------------
      # Nacos 配置（连接用户自己的 Nacos 实例）
      # ------------------------------------------
      - SPRING_CLOUD_NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-host.docker.internal:8848}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=${NACOS_NAMESPACE:-public}
      # ------------------------------------------
      # MongoDB 配置（连接用户自己的 MongoDB 实例）
      # ------------------------------------------
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI:-mongodb://admin:password123@host.docker.internal:27017/doc_aggregator?authSource=admin}
      # ------------------------------------------
      # AI 服务配置
      # ------------------------------------------
      - KNIFE4J_AI_ENABLED=${KNIFE4J_AI_ENABLED:-true}
      - KNIFE4J_AI_SERVICE_URL=http://knife4j-ai-service:9100
      - KNIFE4J_AI_TIMEOUT=${KNIFE4J_AI_TIMEOUT:-60s}
      # ------------------------------------------
      # Java 运行时选项
      # ------------------------------------------
      - JAVA_OPTS=${DOC_AGGREGATOR_JAVA_OPTS:--Xmx1024m -Xms512m}
    extra_hosts:
      # 允许容器访问宿主机服务
      - "host.docker.internal:host-gateway"
    depends_on:
      - knife4j-ai-service
    restart: unless-stopped
    networks:
      - knife4j-network

  # ==========================================
  # Knife4j AI 服务
  # ==========================================
  knife4j-ai-service:
#    image: ${DOCKER_USERNAME:-zhanglongjun}/knife4j-ai-service:${VERSION:-latest}
    image: zhanglongjun/knife4j-ai-service:1.0.0
    container_name: knife4j-ai-service
    ports:
      - "${AI_SERVICE_PORT:-9100}:9100"
    environment:
      # ------------------------------------------
      # Ollama 配置（连接用户原生安装的 Ollama）
      # ------------------------------------------
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
      # ------------------------------------------
      # Java 运行时选项
      # ------------------------------------------
      - JAVA_OPTS=${AI_JAVA_OPTS:--Xmx512m -Xms256m}
    extra_hosts:
      # 允许容器访问宿主机服务
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - knife4j-network

networks:
  knife4j-network:
    driver: bridge
