# ============================================
# Knife4j 文档聚合系统 - Docker Compose 配置
# 
# 使用说明:
#   1. 复制 env.example 为 .env 并修改配置
#   2. 确保 Nacos、MongoDB、Ollama 已运行
#   3. 在 Nacos 配置中心创建路由配置（参考 nacos-config-example.yaml）
#   4. 执行: docker-compose up -d
#   5. 访问: http://localhost:9090/doc.html
#
# 重要: 路由配置需要在 Nacos 配置中心定义，支持动态刷新！
# ============================================
version: '3.8'

services:
  # ==========================================
  # Doc Aggregator 服务（包含前端 UI）
  # ==========================================
  doc-aggregator:
#    image: ${DOCKER_USERNAME:-zhanglongjun}/knife4j-doc-aggregator:${VERSION:-latest}
    image: zhanglongjun/knife4j-doc-aggregator:1.0.0
    container_name: knife4j-doc-aggregator
    ports:
      - "${DOC_AGGREGATOR_PORT:-9090}:9090"
    environment:
      # ------------------------------------------
      # Nacos 服务发现配置
      # ------------------------------------------
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-host.docker.internal:8848}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      # ------------------------------------------
      # Nacos 配置中心（用于动态路由配置）
      # 在 Nacos 中创建 doc-aggregator.yaml 配置
      # 参考: nacos-config-example.yaml
      # ------------------------------------------
      - NACOS_CONFIG_GROUP=${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      # ------------------------------------------
      # MongoDB 配置（可选，用于版本管理）
      # ------------------------------------------
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:password123@host.docker.internal:27017/doc_aggregator?authSource=admin}
      # ------------------------------------------
      # AI 服务配置
      # ------------------------------------------
      - KNIFE4J_AI_ENABLED=${KNIFE4J_AI_ENABLED:-true}
      - KNIFE4J_AI_SERVICE_URL=http://knife4j-ai-service:9100
      - KNIFE4J_AI_TIMEOUT=${KNIFE4J_AI_TIMEOUT:-60s}
      # ------------------------------------------
      # Java 运行时选项
      # ------------------------------------------
      - JAVA_OPTS=${DOC_AGGREGATOR_JAVA_OPTS:--Xmx1024m -Xms512m}
    extra_hosts:
      # 允许容器访问宿主机服务
      - "host.docker.internal:host-gateway"
    depends_on:
      - knife4j-ai-service
    restart: unless-stopped
    networks:
      - knife4j-network

  # ==========================================
  # Knife4j AI 服务
  # ==========================================
  knife4j-ai-service:
#    image: ${DOCKER_USERNAME:-zhanglongjun}/knife4j-ai-service:${VERSION:-latest}
    image: zhanglongjun/knife4j-ai-service:1.0.0
    container_name: knife4j-ai-service
    ports:
      - "${AI_SERVICE_PORT:-9100}:9100"
    environment:
      # ------------------------------------------
      # Ollama 配置（连接用户原生安装的 Ollama）
      # ------------------------------------------
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
      # ------------------------------------------
      # Java 运行时选项
      # ------------------------------------------
      - JAVA_OPTS=${AI_JAVA_OPTS:--Xmx512m -Xms256m}
    extra_hosts:
      # 允许容器访问宿主机服务
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - knife4j-network

networks:
  knife4j-network:
    driver: bridge
