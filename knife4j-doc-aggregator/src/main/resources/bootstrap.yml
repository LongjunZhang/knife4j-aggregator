spring:
  application:
    name: doc-aggregator
  # ===================================================================
  # Spring Cloud Alibaba 2023.x 需要显式配置 spring.config.import
  # 格式: nacos:dataId?group=xxx&refreshEnabled=true
  # ===================================================================
  config:
    import: "optional:nacos:doc-aggregator.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true"
  cloud:
    nacos:
      # Nacos 服务地址
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      # Nacos 认证
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: true
        # 注意: Nacos public 命名空间的 ID 是空字符串，不是 "public"
        namespace: ${NACOS_NAMESPACE:}
      config:
        # 启用 Nacos 配置中心，支持动态路由刷新
        enabled: true
        # 注意: Nacos public 命名空间的 ID 是空字符串，不是 "public"
        namespace: ${NACOS_NAMESPACE:}
        # 配置文件格式
        file-extension: yaml
        # 配置 dataId 前缀
        prefix: ${spring.application.name}
        # 配置分组
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        # 自动刷新配置
        refresh-enabled: true
